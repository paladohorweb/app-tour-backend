services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app_guia_v2
      MYSQL_USER: app_guia
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 10s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:8086:8086"]
    restart: unless-stopped
    mem_limit: 650m
    security_opt: ["no-new-privileges:true"]
volumes:
  mysql_data:
