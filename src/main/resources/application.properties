spring.application.name=app-guia-v2
server.port=${PORT:8086}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/app_guia_v2}
spring.datasource.username=${DB_USER:app_guia}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:1800000}
jwt.refresh.expiration=86400000
app.cors-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
stripe.secret.key=disabled
stripe.webhook.secret=disabled
wompi.base-url=https://sandbox.wompi.co/v1
wompi.public.key=disabled
wompi.private.key=disabled
wompi.redirect-url=https://example.invalid
logging.level.org.springframework.security=INFO
app.legal.name=${LEGAL_NAME:PENDIENTE}
app.legal.tax-id=${LEGAL_TAX_ID:PENDIENTE}
app.legal.address=${LEGAL_ADDRESS:PENDIENTE}
app.legal.email=${LEGAL_EMAIL:PENDIENTE}
app.legal.approved=${LEGAL_APPROVED:false}
logging.level.org.springframework.web.cors=DEBUG
